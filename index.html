<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마케팅 DB 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#16181D; --paper:#FBFBF9; --panel:#FFF; --line:#E6E5E0; --muted:#6E7079;
  --accent:#1F4FD8; --gA:#0E7A5F; --gB:#2563A8; --gC:#B4740E; --gD:#B03A3A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  background:var(--paper);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
table{font-variant-numeric:tabular-nums;border-collapse:collapse;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.hide{display:none!important}

/* layout */
.wrap{display:flex;min-height:100vh}
.side{width:184px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column}
.side .brand{padding:24px 20px 20px}
.side .brand .k{font-size:10px;letter-spacing:.18em;color:var(--muted)}
.side .brand .n{font-size:14px;font-weight:500;margin-top:2px}
.nav{padding:0 8px;flex:1}
.nav button{display:block;width:100%;text-align:left;padding:8px 12px;border:0;background:none;
  border-radius:6px;font:inherit;font-size:13px;color:rgba(22,24,29,.75);cursor:pointer;margin-bottom:2px}
.nav button:hover{background:rgba(230,229,224,.5)}
.nav button.on{background:var(--ink);color:#fff}
.side .foot{padding:12px;border-top:1px solid var(--line)}
.side .foot .em{font-size:11px;color:var(--muted);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;min-width:0;padding:24px 28px}

/* atoms */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.p16{padding:16px}
.lbl{font-size:11px;letter-spacing:.02em;color:var(--muted)}
.val{font-size:22px;font-weight:500;margin-top:6px}
.muted{color:var(--muted)}
.sm{font-size:11px}
.btn{height:36px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:6px;
  font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:rgba(22,24,29,.4)}
.btn-solid{height:36px;padding:0 16px;border:0;background:var(--ink);color:#fff;border-radius:6px;
  font:inherit;font-size:13px;cursor:pointer}
.btn-solid:hover{opacity:.85}
.btn-solid:disabled,.btn:disabled{opacity:.45;cursor:default}
.inp,select.inp,textarea.inp{height:36px;padding:0 10px;border:1px solid var(--line);background:#fff;
  border-radius:6px;font:inherit;font-size:13px;width:100%;color:inherit}
textarea.inp{height:auto;padding:8px 10px;line-height:1.6;resize:vertical}
.inp:focus{border-color:var(--accent);outline:none}
th{text-align:left;font-size:11px;font-weight:400;color:var(--muted);padding:8px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;font-size:13px;border-bottom:1px solid rgba(230,229,224,.7);white-space:nowrap}
.grid{display:grid;gap:12px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.h1{font-size:19px;font-weight:500}
.h2{font-size:14px;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.seg button{height:36px;padding:0 14px;border:0;border-left:1px solid var(--line);background:none;
  font:inherit;font-size:13px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:#fff}
.badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:5px;color:#fff;font-size:12px;font-weight:500}
.badge-o{display:inline-flex;align-items:center;height:22px;padding:0 6px;border:1px solid var(--line);
  border-radius:5px;font-size:11px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.dup{background:rgba(180,116,14,.06)}
.sel-sm{height:28px;padding:0 6px;border:1px solid var(--line);border-radius:5px;font:inherit;font-size:12px;background:#fff}
.bar-bg{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar-fg{height:100%;background:var(--accent)}
.msg{font-size:12px;margin-top:10px}
.err{color:var(--gD)}
.scroll{overflow-x:auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
/* 메뉴 드래그 */
.nav button{position:relative;user-select:none}
.nav button.drag{opacity:.4}
.nav button.over-t{box-shadow:inset 0 2px 0 var(--accent)}
.nav button.over-b{box-shadow:inset 0 -2px 0 var(--accent)}
.nav button .grip{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  font-size:11px;letter-spacing:-1px;color:currentColor;opacity:0;transition:opacity .12s;cursor:grab}
.nav button:hover .grip{opacity:.4}
.nav button.on .grip{opacity:.5}
.nav-reset{width:100%;margin-top:6px;font-size:11px;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px}
.nav-reset:hover{color:var(--ink);text-decoration:underline}
/* 구분선·정렬·폴더 */
.seg .vdiv{width:1px;align-self:stretch;background:var(--line);margin:3px 3px}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--ink)}
details.dgrp{border-bottom:1px solid var(--line)}
details.dgrp:last-child{border-bottom:0}
details.dgrp > summary{list-style:none;cursor:pointer;padding:11px 16px;display:flex;gap:12px;align-items:center;font-size:13px}
details.dgrp > summary::-webkit-details-marker{display:none}
details.dgrp > summary::marker{content:"";display:none}
details.dgrp > summary .arr{transition:transform .15s;font-size:10px;color:var(--muted)}
details.dgrp[open] > summary .arr{transform:rotate(90deg)}
details.dgrp > summary:hover{background:#FAFAF7}

  /* 광고 소재 */
  .adc{transition:opacity .18s, filter .18s}
  .adc.off{opacity:.42;filter:grayscale(1) blur(.6px)}
  .adc.off .tgl,.adc.off .stars,.adc.off button{filter:none;opacity:1}
  .drop{border:1.5px dashed var(--line);border-radius:8px;padding:8px;cursor:pointer;
    transition:border-color .15s,background .15s}
  .drop:hover{border-color:var(--accent)}
  .drop.over{border-color:var(--accent);background:rgba(31,79,216,.06)}
  .fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .fcell{position:relative}
  .fbtns{position:absolute;top:3px;right:3px;display:flex;gap:3px;opacity:0;transition:opacity .15s}
  .fcell:hover .fbtns{opacity:1}
  .fdel,.fdl{width:20px;height:20px;border:0;border-radius:5px;
    background:rgba(0,0,0,.62);color:#fff;font-size:11px;line-height:1;cursor:pointer;padding:0;
    display:grid;place-items:center}
  .fdel{font-size:13px}
  .fdel:hover{background:var(--gD)}
  .fdl:hover{background:var(--accent)}
  .drop.focus{border-color:var(--accent);background:rgba(31,79,216,.04)}
  .drop.busy{opacity:.55;pointer-events:none}
  .paste-tip{font-size:11px;color:var(--muted);margin-top:5px;text-align:center}
  .fdrop{border:1.5px dashed var(--line);border-radius:8px;padding:22px 16px;text-align:center;
    cursor:pointer;transition:border-color .15s,background .15s}
  .fdrop:hover{border-color:var(--accent)}
  .fdrop.over{border-color:var(--accent);background:rgba(31,79,216,.06)}
  .fdrop .big{font-size:13px;font-weight:500}
  .fdrop .sub{font-size:11px;color:var(--muted);margin-top:4px}
  .qrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .qrow:last-child{border-bottom:0}
  .qdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#D6D5CF}
  .qdot.run{background:var(--accent);animation:pulse 1s infinite}
  .qdot.ok{background:var(--gA)} .qdot.err{background:var(--gD)} .qdot.skip{background:var(--gC)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .qname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .qstat{font-size:12px;color:var(--muted);white-space:nowrap}
  .pbar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
  .pbar > div{height:100%;background:var(--accent);transition:width .25s}
  .ph{display:grid;place-items:center;border-radius:6px;background:#F4F4F0;color:var(--muted);font-size:12px}
  .tgl{display:inline-flex;align-items:center;cursor:pointer}
  .tgl input{position:absolute;opacity:0;width:0;height:0}
  .tgl-t{width:34px;height:19px;border-radius:99px;background:#D6D5CF;position:relative;transition:background .18s;display:inline-block}
  .tgl-t::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
    background:#fff;transition:transform .18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .tgl input:checked + .tgl-t{background:var(--gA)}
  .tgl input:checked + .tgl-t::after{transform:translateX(15px)}
  .stars{display:inline-flex;align-items:center;gap:1px}
  .star{border:0;background:none;font-size:17px;line-height:1;color:#D6D5CF;cursor:pointer;padding:0 1px}
  .star.on{color:#E0A100}
  .star:hover{color:#E0A100}
  .star-clr{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;margin-left:3px;padding:0 2px}
  .spin{position:relative}
  .spin .inp{padding-right:30px;font-weight:500}
  .spin-btns{position:absolute;right:1px;top:1px;bottom:1px;width:26px;display:flex;flex-direction:column;
    border-left:1px solid var(--line)}
  .spin-btns button{flex:1;border:0;background:#FAFAF7;cursor:pointer;font-size:8px;color:var(--muted);padding:0}
  .spin-btns button:hover{background:var(--line);color:var(--ink)}
  .spin-btns button:first-child{border-bottom:1px solid var(--line);border-radius:0 5px 0 0}
  .spin-btns button:last-child{border-radius:0 0 5px 0}
  .modal{position:fixed;inset:0;background:rgba(22,24,29,.42);display:grid;place-items:center;padding:24px;z-index:50}
  .modal-box{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:620px;max-height:88vh;overflow-y:auto}

label.f{display:block}
label.f .lbl{display:block;margin-bottom:4px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .box{width:100%;max-width:320px}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

/* ============================================================
   설정 — Supabase 접속 정보
   ============================================================ */
const SUPABASE_URL  = "https://gkbavdbwsssvxkqqibex.supabase.co";
const SUPABASE_ANON  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrYmF2ZGJ3c3NzdnhrcXFpYmV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNTIwMjEsImV4cCI6MjEwMDcyODAyMX0.8ZLXlDT0xbDYimSYCl0gtsLpnRvOMhZ9fa8clw4Pl2A";
/* ============================================================ */

const DEFAULT_EMAIL = "tsauto1118@naver.com";
const DEMO = false;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { persistSession: true, autoRefreshToken: true }
});

const S = {
  user: null, role: "marketer", page: "dashboard", days: 30,
  dash: { mode:"30", from:"", to:"" },
  channels: [], media: [], models: [], camps: [], creas: [],
  leadTab: "목록", leadFilter: { q:"", ch:"", st:"" }, sel: new Set(),
  up: { channel_id:"", media_id:"", file:"", headers:[], rows:[], map:{}, check:null, queue:null },
  perfTab: "채널", setTab: "채널·매체", cmpUnit: "일",
  pasteTarget: null,
  costTab: "입력",
  meta: { parsed:null, queue:null, mode:"30", days:30, from:"", to:"", sort:null },
  ads: { channel_id:2, view:"폴더", period:"이번달", from:"", to:"",
         rating:"", budget:"", onoff:"", sort:"desc", q:"" }
};

const STATUS = ["신규","상담중","견적발송","심사요청","심사통과","계약","이탈"];
const CREDIT = ["미신청","통과","거절","보류"];
const SOURCE = ["신규","재문의","소개"];
const DOW = ["일","월","화","수","목","금","토"];
const GC = { A:"#0E7A5F", B:"#2563A8", C:"#B4740E", D:"#B03A3A" };
const GL = { A:"예산 증액", B:"유지", C:"소재 교체", D:"중단 검토" };

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const won = (n) => n == null ? "-" : "\u20A9" + Math.round(n).toLocaleString("ko-KR");
const num = (n) => n == null ? "-" : Math.round(n).toLocaleString("ko-KR");
const pct = (n, d = 1) => n == null ? "-" : Number(n).toFixed(d) + "%";
const pad = (v) => String(v).padStart(2, "0");
const ymd = (dt) => `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const daysAgo = (n) => { const d = new Date(); d.setDate(d.getDate()-n); return ymd(d); };
const yymm = () => { const d = new Date(); return String(d.getFullYear()).slice(2) + pad(d.getMonth()+1); };
const thisYm = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const localNow = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
const badge = (g) => g ? `<span class="badge" style="background:${GC[g]}" title="${GL[g]}">${g}</span>` : `<span class="badge-o">오가닉</span>`;
const opt = (arr, sel, val, txt) => arr.map(o => {
  const v = val ? o[val] : o, t = txt ? o[txt] : o;
  return `<option value="${esc(v)}"${String(v)===String(sel)?" selected":""}>${esc(t)}</option>`;
}).join("");
const delta = (cur, prev, invert) => {
  if (prev == null || prev === 0 || cur == null) return `<span class="muted">-</span>`;
  const r = (cur - prev) / prev * 100;
  const good = invert ? r < 0 : r > 0;
  const col = Math.abs(r) < 0.5 ? "var(--muted)" : (good ? "var(--gA)" : "var(--gD)");
  return `<span style="color:${col}">${r > 0 ? "▲" : r < 0 ? "▼" : "–"} ${Math.abs(r).toFixed(1)}%</span>`;
};
const weekStart = (s) => { const d = new Date(s); d.setDate(d.getDate() - d.getDay()); return ymd(d); };

/* ---------- charts ---------- */
function svgLine(data, key, color) {
  if (!data.length) return `<div class="empty">표시할 추이가 없습니다.</div>`;
  const W = 640, H = 210, PL = 52, PR = 12, PT = 20, PB = 10;
  const vals = data.map(d => Number(d[key]) || 0);
  const max = Math.max(1, ...vals);
  const minV = Math.min(...vals);
  const step = data.length > 1 ? (W - PL - PR) / (data.length - 1) : 0;
  const X = (i) => PL + i * step;
  const Y = (v) => H - PB - (v / max) * (H - PT - PB);
  const fmt = (v) => v >= 10000 ? (v/10000).toFixed(v >= 100000 ? 0 : 1) + "만" : num(v);

  const pts = data.map((d,i) => `${X(i).toFixed(1)},${Y(vals[i]).toFixed(1)}`).join(" ");
  const grid = [0.25,0.5,0.75,1].map(r => {
    const y = Y(max*r).toFixed(1);
    return `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#E6E5E0" stroke-width="1"/>
      <text x="${PL-6}" y="${(+y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#8B8A85">${fmt(max*r)}</text>`;
  }).join("");

  const iMax = vals.indexOf(Math.max(...vals));
  const iMin = vals.indexOf(minV);
  const c = color || "var(--accent)";
  const mark = (i, v, above, col) => {
    const x = X(i), y = Y(v);
    const tx = Math.min(Math.max(x, PL + 16), W - PR - 16);
    const ty = above ? Math.max(y - 7, 10) : Math.min(y + 14, H - 2);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${col}"/>
      <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${col}">${num(v)}</text>`;
  };
  let marks = mark(iMax, vals[iMax], true, c);
  if (iMin !== iMax && data.length > 1) marks += mark(iMin, minV, false, "#8B8A85");

  const dots = data.map((d,i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(vals[i]).toFixed(1)}" r="9" fill="transparent"><title>${esc(d.k ?? d.d)} · ${num(vals[i])}</title></circle>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:210px" role="img" aria-label="추이">
    ${grid}<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2"/>${marks}${dots}</svg>
    <div class="sm muted" style="display:flex;justify-content:space-between;margin-top:6px">
      <span>${esc(data[0].k ?? data[0].d)}</span>
      <span>최고 ${num(Math.max(...vals))} · 최저 ${num(minV)}</span>
      <span>${esc(data[data.length-1].k ?? data[data.length-1].d)}</span></div>`;
}

function svgDual(cur, prev, key, labels) {
  const n = Math.max(cur.length, prev.length);
  if (!n) return `<div class="empty">비교할 데이터가 없습니다.</div>`;
  const W = 640, H = 210, P = 8;
  const max = Math.max(1, ...cur.map(d=>d[key]), ...prev.map(d=>d[key]));
  const step = n > 1 ? (W - P*2) / (n - 1) : 0;
  const line = (arr, color, dash) => {
    if (!arr.length) return "";
    const pts = arr.map((d,i) => `${(P+i*step).toFixed(1)},${(H-P-(d[key]/max)*(H-P*2)).toFixed(1)}`).join(" ");
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"${dash?' stroke-dasharray="4 3"':""}/>`;
  };
  const grid = [0.25,0.5,0.75,1].map(r => `<line x1="0" y1="${(H-P-r*(H-P*2)).toFixed(1)}" x2="${W}" y2="${(H-P-r*(H-P*2)).toFixed(1)}" stroke="#E6E5E0" stroke-width="1"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:210px" role="img" aria-label="기간 비교">
      ${grid}${line(prev,"#B9B8B2",true)}${line(cur,"var(--accent)",false)}</svg>
    <div class="sm" style="display:flex;gap:16px;margin-top:8px">
      <span><span style="display:inline-block;width:14px;height:2px;background:var(--accent);vertical-align:middle"></span> ${esc(labels[0])}</span>
      <span class="muted"><span style="display:inline-block;width:14px;height:2px;background:#B9B8B2;vertical-align:middle"></span> ${esc(labels[1])}</span>
      <span class="muted" style="margin-left:auto">최고 ${num(max)}</span></div>`;
}

function svgBar(data) {
  if (!data.length) return `<div class="empty">표시할 채널이 없습니다.</div>`;
  const max = Math.max(1, ...data.map(d => d.leads));
  return `<div style="display:flex;flex-direction:column;gap:8px">` + data.map(d => `
    <div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
      <span>${esc(d.name)}</span><span class="muted">${num(d.leads)}</span></div>
      <div class="bar-bg"><div class="bar-fg" style="width:${(d.leads/max*100).toFixed(1)}%;background:var(--ink)"></div></div>
    </div>`).join("") + `</div>`;
}

function heatmap(rows) {
  const m = new Map(); let max = 0;
  rows.forEach(r => { const k = r.dow+"-"+r.hour; const v = (m.get(k)??0)+r.valid_leads; m.set(k,v); if(v>max) max=v; });
  if (!max) return `<div class="empty">유입 시간 데이터가 없습니다.</div>`;
  let h = `<div class="scroll"><div style="min-width:620px"><div style="display:flex"><div style="width:22px"></div>` +
    Array.from({length:24},(_,i)=>`<div style="flex:1;text-align:center;font-size:10px;color:var(--muted);padding-bottom:3px">${i%3===0?i:""}</div>`).join("")+`</div>`;
  DOW.forEach((lab,dw) => {
    h += `<div style="display:flex;align-items:center"><div style="width:22px;font-size:11px;color:var(--muted)">${lab}</div>`;
    for (let hr=0; hr<24; hr++) {
      const v = m.get(dw+"-"+hr) ?? 0, a = v ? 0.12+(v/max)*0.78 : 0;
      h += `<div style="flex:1;padding:1px"><div title="${lab} ${hr}시 · ${v}건" style="height:20px;border-radius:2px;background:${v?`rgba(31,79,216,${a.toFixed(2)})`:"#F2F2EE"}"></div></div>`;
    }
    h += `</div>`;
  });
  return h + `</div></div>`;
}

function toCsv(rows) {
  if (!rows.length) return "";
  const cols = Object.keys(rows[0]);
  const e = (v) => { const s = v==null?"":String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  return [cols.join(","), ...rows.map(r => cols.map(c => e(r[c])).join(","))].join("\n");
}

function bindNavDrag() {
  const nav = $("nav"); if (!nav) return;
  let src = null;

  nav.querySelectorAll("button[data-p]").forEach(b => {
    b.ondragstart = (e) => {
      src = b; b.classList.add("drag");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", b.dataset.p); } catch(_) {}
    };
    b.ondragend = () => {
      src = null;
      nav.querySelectorAll("button").forEach(x => x.classList.remove("drag","over-t","over-b"));
    };
    b.ondragover = (e) => {
      if (!src || src === b) return;
      e.preventDefault();
      const r = b.getBoundingClientRect();
      const up = e.clientY < r.top + r.height/2;
      b.classList.toggle("over-t", up);
      b.classList.toggle("over-b", !up);
    };
    b.ondragleave = () => b.classList.remove("over-t","over-b");
    b.ondrop = (e) => {
      e.preventDefault();
      if (!src || src === b) return;
      const r = b.getBoundingClientRect();
      const up = e.clientY < r.top + r.height/2;
      b.parentNode.insertBefore(src, up ? b : b.nextSibling);
      src.dataset.moved = "1";
      b.classList.remove("over-t","over-b");
      const map = new Map(NAV_DEFAULT);
      const list = Array.from(nav.querySelectorAll("button[data-p]"))
        .map(x => [x.dataset.p, map.get(x.dataset.p)]);
      saveNav(list);
    };
  });
}

/* ---------- 전량 조회 (1,000행 제한 우회) ---------- */
async function fetchAllRows(build, maxPages = 30) {
  const out = [];
  for (let i = 0; i < maxPages; i++) {
    const { data, error } = await build().range(i * 1000, i * 1000 + 999);
    if (error) return { data: out, error };
    out.push(...(data ?? []));
    if (!data || data.length < 1000) break;
  }
  return { data: out, error: null };
}

/* ============================================================
   DB 원장
   ============================================================ */
const FIELDS = [
  { k:"inflow_at", l:"유입일시", hint:["일시","날짜","유입","등록","생성","접수","시간","date","time","created","timestamp"] },
  { k:"name",      l:"고객명",   hint:["이름","성명","고객","닉네임","성함","name"] },
  { k:"phone",     l:"연락처",   hint:["연락처","전화","휴대","핸드폰","폰","번호","phone","mobile","tel"] },
  { k:"region",    l:"지역",     hint:["지역","주소","거주","시도","region","city"] },
  { k:"memo",      l:"메모",     hint:["메모","비고","문의","내용","요청","상담","memo","note","message"] }
];
function guessMap(headers) {
  const m = {};
  FIELDS.forEach(f => {
    const hit = headers.findIndex(h => {
      const t = String(h).toLowerCase().replace(/\s/g,"");
      return f.hint.some(x => t.includes(x));
    });
    m[f.k] = hit >= 0 ? String(hit) : "";
  });
  return m;
}
const digits = (v) => String(v ?? "").replace(/[^0-9]/g,"");
function parseWhen(v) {
  if (v == null || v === "") return null;
  if (v instanceof Date && !isNaN(v)) return v;
  const d = new Date(String(v).trim().replace(/\./g,"-").replace(/\//g,"-"));
  return isNaN(d) ? null : d;
}

function renderQueue(Q) {
  const box = $("u_queue"); if (!box) return;
  if (!Q) { box.innerHTML = ""; return; }
  const done = Q.items.filter(x => x.state !== "wait" && x.state !== "run").length;
  const totRow = Q.items.reduce((a,x)=>a+(x.saved||0),0);
  const totDup = Q.items.reduce((a,x)=>a+(x.dup||0),0);
  box.innerHTML = `<section class="card" style="margin-bottom:12px">
    <div class="p16" style="padding-bottom:10px;display:flex;justify-content:space-between;align-items:baseline">
      <h2 class="h2">일괄 처리 ${Q.running?"진행 중":"완료"}</h2>
      <span class="sm muted">${done} / ${Q.items.length} 파일</span></div>
    <div style="padding:0 16px 12px"><div class="pbar"><div style="width:${(done/Q.items.length*100).toFixed(0)}%"></div></div></div>
    <div style="border-top:1px solid var(--line)">
      ${Q.items.map(x=>`<div class="qrow">
        <span class="qdot ${x.state==="run"?"run":x.state==="ok"?"ok":x.state==="err"?"err":x.state==="skip"?"skip":""}"></span>
        <span class="qname">${esc(x.name)}</span>
        <span class="qstat">${esc(x.msg ?? "대기 중")}</span></div>`).join("")}
    </div>
    ${!Q.running?`<div class="p16" style="border-top:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap">
      <span class="sm"><b>${num(totRow)}</b>건 저장</span>
      <span class="sm" style="color:var(--gC)">중복 <b>${num(totDup)}</b>건</span>
      <button class="btn" id="q_close" style="height:28px;margin-left:auto">닫기</button></div>`:""}
  </section>`;
  if ($("q_close")) $("q_close").onclick = () => { S.up.queue = null; renderQueue(null); };
}

async function runQueue(files) {
  const chId = +$("u_ch").value, mdId = $("u_md").value ? +$("u_md").value : null;
  const Q = { running:true, items: files.map(f => ({ name:f.name, state:"wait", msg:null, saved:0, dup:0 })) };
  S.up.queue = Q;
  $("u_step2").innerHTML = ""; $("u_step3").innerHTML = "";
  renderQueue(Q);

  const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");

  for (let i = 0; i < files.length; i++) {
    const it = Q.items[i];
    it.state = "run"; it.msg = "읽는 중"; renderQueue(Q);
    try {
      const wb = XLSX.read(await files[i].arrayBuffer(), { type:"array", cellDates:true });
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, blankrows:false, defval:"" });
      if (aoa.length < 2) { it.state="skip"; it.msg="데이터 없음"; renderQueue(Q); continue; }
      let hi = 0;
      for (let r=0;r<Math.min(aoa.length,10);r++) if (aoa[r].filter(x=>String(x).trim()).length >= 2) { hi = r; break; }
      const MP = parseMetaAoa(aoa);
      if (MP) {
        it.msg = `메타 실적 · ${num(MP.rows.length)}행 저장 중`; renderQueue(Q);
        const r = await pushMeta(MP.rows, files[i].name, true);
        if (!r.ok) { it.state="err"; it.msg = r.err || "저장 실패"; }
        else { it.state="ok"; it.msg = `메타 실적 ${num(r.ok)}행 · ${won(MP.spend)} · 결과 ${num(MP.results)}건`; }
        renderQueue(Q); continue;
      }
      const headers = aoa[hi].map(x => String(x).trim());
      const rows = aoa.slice(hi+1).filter(r => r.some(x => String(x).trim() !== ""));
      const map = guessMap(headers);
      if (map.phone === "") { it.state="skip"; it.msg="연락처 열을 찾지 못했습니다"; renderQueue(Q); continue; }

      it.msg = `${num(rows.length)}행 · 중복 검사 중`; renderQueue(Q);
      const pi = +map.phone;
      const parsed = rows.map(r => ({
        phone: String(r[pi] ?? "").trim(), pn: digits(r[pi]),
        name: map.name !== "" ? String(r[+map.name] ?? "").trim() : "",
        region: map.region !== "" ? String(r[+map.region] ?? "").trim() : "",
        memo: map.memo !== "" ? String(r[+map.memo] ?? "").trim() : "",
        when: map.inflow_at !== "" ? parseWhen(r[+map.inflow_at]) : null
      })).filter(x => x.pn.length >= 8);
      if (!parsed.length) { it.state="skip"; it.msg="유효한 연락처 없음"; renderQueue(Q); continue; }

      const uniq = Array.from(new Set(parsed.map(x=>x.pn)));
      let dup = 0;
      for (let k=0;k<uniq.length;k+=200) {
        const { data } = await sb.from("leads").select("phone_norm").in("phone_norm", uniq.slice(k,k+200));
        dup += new Set((data ?? []).map(d=>d.phone_norm)).size;
      }
      it.dup = dup;

      it.msg = `${num(parsed.length)}건 저장 중`; renderQueue(Q);
      const { data: batch } = await sb.from("import_batches").insert({
        type:"lead", file_name:files[i].name, row_count:parsed.length,
        uploaded_by:S.user?.id ?? null, channel_id:chId, media_id:mdId
      }).select("id").single();

      const payload = parsed.map(x => ({
        inflow_at: (x.when ?? new Date()).toISOString(),
        channel_id: chId, media_id: mdId,
        name: x.name || null, phone: x.phone || null,
        region: x.region || null, memo: x.memo || null,
        source_type: "신규", import_batch_id: batch?.id ?? null
      }));
      let saved = 0, lastErr = "";
      for (let k=0;k<payload.length;k+=200) {
        const { error } = await sb.from("leads").insert(payload.slice(k,k+200));
        if (error) lastErr = error.message; else saved += Math.min(200, payload.length-k);
      }
      it.saved = saved;
      if (saved === 0) { it.state="err"; it.msg = lastErr || "저장 실패"; }
      else { it.state="ok"; it.msg = `${num(saved)}건 저장${dup?` · 중복 ${num(dup)}`:""}${lastErr?" · 일부 실패":""}`; }
    } catch (e) {
      it.state="err"; it.msg = e.message;
    }
    renderQueue(Q);
  }

  Q.running = false;
  renderQueue(Q);
  await loadMasters();
}

async function readFile(file) {
  if (!file) return;
  const m = $("u_msg");
  if (!$("u_ch").value) { m.className="msg err"; m.textContent="채널을 먼저 선택하세요."; return; }

  try {
    const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
    const wb = XLSX.read(await file.arrayBuffer(), { type:"array", cellDates:true });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, blankrows:false, defval:"" });
    if (aoa.length < 2) { m.className="msg err"; m.textContent="데이터가 없는 파일입니다."; return; }
    let hi = 0;
    for (let i=0;i<Math.min(aoa.length,10);i++) if (aoa[i].filter(x=>String(x).trim()).length >= 2) { hi = i; break; }
    // 메타 광고 리포트면 자동으로 광고 실적으로 처리
    if (isMetaHeaders(aoa[hi].map(x => String(x).trim())) || parseMetaAoa(aoa)) {
      const P = parseMetaAoa(aoa);
      if (P) {
        m.className="msg";
        m.textContent = `메타 광고 리포트로 인식했습니다. ${P.from}~${P.to} · 소재 ${P.ads.length}개 · ${won(P.spend)}`;

          <h2 class="h2" style="margin-bottom:6px">메타 광고 리포트로 인식했습니다</h2>

            이 파일은 고객 DB가 아니라 광고 실적 파일입니다. 아래 버튼을 누르면
            일자 · 소재 · 플랫폼 · 노출위치 · 결과 · 예산까지 자동 정리되어 광고비에 저장됩니다.</p>
          <div class="grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:14px">
            ${[["기간",`${P.from}<br>~ ${P.to}`],["소재",num(P.ads.length)+"개"],["지출",won(P.spend)],
               ["노출",num(P.imp)],["결과(유입)",num(P.results)+"건"]]
              .map(([l,v])=>`<div style="border:1px solid var(--line);border-radius:6px;padding:10px">
                <div class="lbl">${l}</div><div style="font-size:14px;font-weight:500;margin-top:4px;line-height:1.4">${v}</div></div>`).join("")}
          </div>
          <button class="btn-solid" id="u_meta_go">광고 실적으로 저장</button>
          <span class="msg" id="u_meta_msg"></span></section>`;
        $("u_step3").innerHTML = "";
        $("u_meta_go").onclick = async () => {

async function runCheck() {
  const U = S.up, m = $("u_cmsg");
  if (U.map.phone === "") { m.className="msg err"; m.textContent="연락처 항목을 연결하세요."; return; }
  m.className="msg"; m.textContent="검사 중";
  const pi = +U.map.phone;
  const parsed = U.rows.map((r,idx)=>({
    idx, phone: String(r[pi] ?? "").trim(), pn: digits(r[pi]),
    name: U.map.name !== "" ? String(r[+U.map.name] ?? "").trim() : "",
    region: U.map.region !== "" ? String(r[+U.map.region] ?? "").trim() : "",
    memo: U.map.memo !== "" ? String(r[+U.map.memo] ?? "").trim() : "",
    when: U.map.inflow_at !== "" ? parseWhen(r[+U.map.inflow_at]) : null
  })).filter(x => x.pn.length >= 8);

  const seen = new Map(), inFile = [];
  parsed.forEach(x => { if (seen.has(x.pn)) inFile.push(x); else seen.set(x.pn, x); });

  const uniq = Array.from(seen.keys()), found = [];
  for (let i=0;i<uniq.length;i+=200) {
    const { data } = await sb.from("leads")
      .select("id,lead_no,inflow_at,channel_id,media_id,name,phone_norm,status")
      .in("phone_norm", uniq.slice(i,i+200));
    (data ?? []).forEach(d => found.push(d));
  }
  const exist = new Map();
  found.forEach(d => { const p = exist.get(d.phone_norm); if (!p || d.inflow_at < p.inflow_at) exist.set(d.phone_norm, d); });

  U.check = { total:U.rows.length, valid:parsed.length, skipped:U.rows.length-parsed.length,
    inFile, exist, parsed,
    newCount: uniq.filter(p=>!exist.has(p)).length,
    dupCount: uniq.filter(p=>exist.has(p)).length };
  m.textContent = "";
  renderCheck();
}

      </div></div>`:`<p class="sm muted" style="margin-bottom:16px">중복 없이 모두 신규입니다.</p>`}

        <td>${esc(chName(e.channel_id))}${e.media_id?` <span class="muted">· ${esc(mdName(e.media_id))}</span>`:""}</td>
        <td class="muted">${esc((e.inflow_at??"").slice(0,10))}</td><td class="muted">${esc(e.status)}</td></tr>`;}).join("")}
      </tbody></table>${dupRows.length>200?`<div class="sm muted p16">외 ${num(dupRows.length-200)}건</div>`:""}</div>`:""}

      <span class="msg" id="u_smsg"></span>
    </div>
    <p class="sm muted" style="margin-top:12px">기본값은 중복도 함께 저장하고 표시만 남기는 방식입니다. 저장 후 업로드 이력 탭에서 통째로 되돌릴 수 있습니다.</p>

async function saveUpload() {
  const U = S.up, C = U.check, m = $("u_smsg");
  const skip = $("u_skip").checked, src = $("u_src").value;
  const chId = +$("u_ch").value, mdId = $("u_md").value ? +$("u_md").value : null;
  if (!chId) { m.className="msg err"; m.textContent="채널을 선택하세요."; return; }
  let list = C.parsed;
  if (skip) { const used = new Set();
    list = list.filter(x => { if (C.exist.has(x.pn)||used.has(x.pn)) return false; used.add(x.pn); return true; }); }
  if (!list.length) { m.className="msg err"; m.textContent="저장할 건이 없습니다."; return; }

  $("u_save").disabled = true; m.className="msg"; m.textContent="저장 중";
  const { data: batch } = await sb.from("import_batches").insert({
    type:"lead", file_name:U.file, row_count:list.length,
    uploaded_by:S.user?.id ?? null, channel_id:chId, media_id:mdId
  }).select("id").single();

  const payload = list.map(x => ({
    inflow_at: (x.when ?? new Date()).toISOString(),
    channel_id: chId, media_id: mdId,
    name: x.name || null, phone: x.phone || null,
    region: x.region || null, memo: x.memo || null,
    source_type: src, import_batch_id: batch?.id ?? null
  }));

  let ok=0, fail=0, lastErr="";
  for (let i=0;i<payload.length;i+=200) {
    const { error } = await sb.from("leads").insert(payload.slice(i,i+200));
    if (error) { fail += Math.min(200, payload.length-i); lastErr = error.message; }
    else ok += Math.min(200, payload.length-i);
  }
  $("u_save").disabled = false;
  if (fail) { m.className="msg err"; m.textContent=`${num(ok)}건 저장, ${num(fail)}건 실패: ${lastErr}`; return; }
  m.className="msg"; m.textContent=`${num(ok)}건을 저장했습니다. 화면을 갱신합니다.`;
  S.up = { channel_id:String(chId), media_id: mdId?String(mdId):"", file:"", headers:[], rows:[], map:{}, check:null };
  setTimeout(() => { S.leadTab = "목록"; hardRefresh(); }, 900);
}

async function dupView() {

    .eq("is_duplicate", true).order("inflow_at",{ascending:false}).limit(1000);
  const dups = data ?? [];
  if (!dups.length) { $("lbody").innerHTML = `<div class="card empty">중복으로 표시된 DB가 없습니다.</div>`; return; }

  const ids = Array.from(new Set(dups.map(d=>d.duplicate_of).filter(Boolean)));
  const orig = new Map();
  for (let i=0;i<ids.length;i+=200) {
    const { data:o } = await sb.from("leads").select("id,lead_no,inflow_at,channel_id,media_id,status").in("id", ids.slice(i,i+200));
    (o ?? []).forEach(x => orig.set(x.id,x));
  }
  const cross = new Map();
  dups.forEach(d => { const o = orig.get(d.duplicate_of); if (!o) return;
    const k = o.channel_id+">"+d.channel_id; cross.set(k,(cross.get(k)??0)+1); });
  const rows = Array.from(cross.entries()).map(([k,v])=>{const [a,b]=k.split(">").map(Number);return {from:a,to:b,n:v};}).sort((a,b)=>b.n-a.n);
  const { data: dr } = await sb.from("v_duplicate").select("*");

  $("lbody").innerHTML = `
    <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:12px">
      <section class="card p16"><h2 class="h2" style="margin-bottom:12px">채널별 중복률</h2>
        ${(dr??[]).length?`<table><thead><tr><th>채널</th><th>전체</th><th>중복</th><th>중복률</th></tr></thead>
          <tbody>${(dr??[]).sort((a,b)=>(b.dup_rate??0)-(a.dup_rate??0)).map(x=>`<tr>
            <td>${esc(chName(x.channel_id))}</td><td>${num(x.total_leads)}</td><td>${num(x.dup_leads)}</td>
            <td style="font-weight:500;${(x.dup_rate??0)>=20?"color:var(--gD)":""}">${pct(x.dup_rate)}</td></tr>`).join("")}
          </tbody></table>`:`<div class="empty">데이터가 없습니다.</div>`}</section>
      <section class="card p16"><h2 class="h2" style="margin-bottom:4px">중복 유입 경로</h2>
        <p class="sm muted" style="margin-bottom:12px">먼저 들어온 채널 → 나중에 다시 들어온 채널</p>
        ${rows.length?`<table><thead><tr><th>최초 유입</th><th></th><th>재유입</th><th>건수</th></tr></thead>
          <tbody>${rows.map(r=>`<tr><td>${esc(chName(r.from))}</td><td class="muted">→</td>
            <td>${esc(chName(r.to))}</td><td style="font-weight:500">${num(r.n)}</td></tr>`).join("")}</tbody></table>`
          :`<div class="empty">분석할 중복이 없습니다.</div>`}</section>
    </div>
    <div class="card scroll">
      <div class="p16" style="padding-bottom:8px"><h2 class="h2">중복 건 목록 <span class="sm muted">${num(dups.length)}건</span></h2></div>
      <table><thead><tr><th>DB 번호</th><th>고객명</th><th>연락처</th><th>이번 유입</th><th>유입일</th>
        <th>최초 DB번호</th><th>최초 채널</th><th>최초 유입일</th><th>최초 상태</th></tr></thead>
      <tbody>${dups.map(d=>{const o=orig.get(d.duplicate_of);return `<tr class="dup">
        <td class="mono">${esc(d.lead_no??"-")}</td><td>${esc(d.name??"-")}</td><td>${esc(d.phone??"-")}</td>
        <td>${esc(chName(d.channel_id))}${d.media_id?` <span class="muted">· ${esc(mdName(d.media_id))}</span>`:""}</td>
        <td class="muted">${esc((d.inflow_at??"").slice(0,10))}</td>
        <td class="mono muted">${esc(o?.lead_no??"-")}</td><td>${o?esc(chName(o.channel_id)):"-"}</td>
        <td class="muted">${esc((o?.inflow_at??"").slice(0,10))}</td><td class="muted">${esc(o?.status??"-")}</td></tr>`;}).join("")}
      </tbody></table></div>`;
}

        <textarea class="inp mono" id="c_paste" rows="7" placeholder="2026-07-26&#9;IG-REEL&#9;180000&#9;42000&#9;610"></textarea>
        <button class="btn-solid" id="c_load" style="margin-top:12px">불러오기</button>
        <span class="msg" id="c_pmsg"></span></section>
    </div>
    ${rows.length?`<div class="card scroll"><table><thead><tr>
      <th>일자</th><th>채널 · 매체</th><th>캠페인</th><th>노출</th><th>클릭</th><th>광고비</th><th></th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${esc(r.cost_date)}</td>
        <td>${esc(chName(r.channel_id))}${r.media_id?` <span class="muted">· ${esc(mdName(r.media_id))}</span>`:""}</td>
        <td class="muted">${esc(S.camps.find(c=>c.id===r.campaign_id)?.name ?? "-")}</td>
        <td class="muted">${num(r.impressions)}</td><td class="muted">${num(r.clicks)}</td>
        <td style="font-weight:500">${won(r.cost)}</td>
        <td><button class="btn" data-del="${r.id}" style="height:26px;padding:0 8px;color:var(--gD)">삭제</button></td></tr>`).join("")}
      </tbody></table></div>`:`<div class="card empty">등록된 광고비가 없습니다.</div>`}`;

  if (!$("c_ch")) return;
  $("c_ch").onchange = (e) => {
    const ms = S.media.filter(m => String(m.channel_id)===e.target.value && m.is_active);
    $("c_md").innerHTML = `<option value="">선택</option>` + opt(ms,"","id","name");
  };
  const conflict = "cost_date,channel_id,media_id,campaign_id,creative_id";
  $("c_save").onclick = async () => {
    const m = $("c_msg");
    if (!$("c_ch").value) { m.className="msg err"; m.textContent="채널을 선택하세요."; return; }
    $("c_save").disabled = true;
    const { error } = await sb.from("ad_costs").upsert({
      cost_date:$("c_dt").value, channel_id:+$("c_ch").value,
      media_id:$("c_md").value?+$("c_md").value:null,
      campaign_id:$("c_cp").value?+$("c_cp").value:null,
      creative_id:$("c_cr").value?+$("c_cr").value:null,
      impressions:+($("c_im").value||0), clicks:+($("c_ck").value||0), cost:+($("c_cs").value||0)
    },{ onConflict:conflict });
    $("c_save").disabled = false;
    if (error) { m.className="msg err"; m.textContent="저장하지 못했습니다: "+error.message; return; }
    vCosts();
  };
  $("c_load").onclick = async () => {
    const lines = $("c_paste").value.split("\n").map(l=>l.trim()).filter(Boolean);
    const m = $("c_pmsg");
    if (!lines.length) { m.className="msg err"; m.textContent="붙여넣을 내용이 없습니다."; return; }
    const byCode = new Map(S.media.map(x=>[x.code.toUpperCase(),x]));
    const byName = new Map(S.media.map(x=>[x.name,x]));
    const payload = []; let bad = 0;
    for (const line of lines) {
      const c = line.split(/\t|,/).map(x=>x.trim());
      if (c.length < 3) { bad++; continue; }
      const [date,key,cost,imp,clk] = c;
      const md = byCode.get(String(key).toUpperCase()) ?? byName.get(key);
      if (!md || !/^\d{4}-\d{2}-\d{2}$/.test(date)) { bad++; continue; }
      payload.push({ cost_date:date, channel_id:md.channel_id, media_id:md.id,
        cost:+(String(cost).replace(/[^0-9.]/g,"")||0),
        impressions:+(String(imp??"").replace(/[^0-9]/g,"")||0),
        clicks:+(String(clk??"").replace(/[^0-9]/g,"")||0) });
    }
    if (!payload.length) { m.className="msg err"; m.textContent=`인식된 행이 없습니다. (${bad}행 실패)`; return; }
    $("c_load").disabled = true;
    const { error } = await sb.from("ad_costs").upsert(payload,{ onConflict:conflict });
    $("c_load").disabled = false;
    if (error) { m.className="msg err"; m.textContent="저장하지 못했습니다: "+error.message; return; }
    vCosts();
  };
  $("c_body").querySelectorAll("button[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("이 광고비 기록을 삭제할까요?")) return;
    await sb.from("ad_costs").delete().eq("id", +b.dataset.del); vCosts();
  });
}

const BUCKET = "ad-assets";
const BUDGET_STEP = 5000;

const fileUrl = (path) => DEMO ? path
  : `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;

const monthRange = (offset) => {
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + offset);
  const from = ymd(d);
  const e = new Date(d); e.setMonth(e.getMonth()+1); e.setDate(0);
  return [from, ymd(e)];
};

function stars(n, id) {
  return `<span class="stars" data-star-for="${id}">` +
    [1,2,3,4,5].map(i => `<button type="button" class="star${i<=n?" on":""}" data-v="${i}"
      title="${i}점" aria-label="${i}점">★</button>`).join("") +
    `<button type="button" class="star-clr" data-v="0" title="해제">×</button></span>`;
}

async function loadAds() {
  const F = S.ads;
  const setSub = (t) => { const el = $("asub"); if (el) el.textContent = t; };
  const setBody = (h) => { const el = $("a_body"); if (el) el.innerHTML = h; };

  let res;
  try {
    let q = sb.from("ad_creatives").select("*").eq("channel_id", F.channel_id);
    if (F.from) q = q.gte("published_on", F.from);
    if (F.to)   q = q.lte("published_on", F.to);
    if (F.onoff) q = q.eq("is_on", F.onoff === "on");
    res = await q.order("published_on", { ascending: F.sort === "asc" }).limit(500);
  } catch (e) { res = { data: null, error: { message: e.message } }; }

  if (res.error) {
    const miss = /ad_creatives|does not exist|schema cache|relation/i.test(res.error.message ?? "");
    setSub("");
    setBody(`<div class="card p16" style="border-color:var(--gC)">
      <div style="font-weight:500;color:var(--gC);margin-bottom:6px">자료를 불러오지 못했습니다</div>
      <p class="sm" style="line-height:1.7">${esc(res.error.message ?? "알 수 없는 오류")}</p>
      ${miss?`<p class="sm muted" style="margin-top:10px;line-height:1.7">
        광고 소재 표가 아직 만들어지지 않았습니다.<br>
        Supabase 대시보드 → SQL Editor 에서 <span class="mono">patch_03_ad_creatives.sql</span> 을 실행한 뒤
        이 화면을 새로고침하세요.</p>`:""}
    </div>`);
    return;
  }

  let rows = res.data ?? [];
  if (F.rating !== "") {
    const r = +F.rating;
    rows = r === 0 ? rows.filter(x=>(x.rating??0)===0)
         : r === 5 ? rows.filter(x=>(x.rating??0)===5)
         : rows.filter(x=>(x.rating??0)>=r);
  }
  if (F.budget) {
    const [a,b] = F.budget.split("-");
    rows = rows.filter(x => {
      const v = x.daily_budget ?? 0;
      if (F.budget === "0") return v === 0;
      if (b === "") return v >= +a;
      return v >= +a && v <= +b;
    });
  }
  if (F.q.trim()) {
    const k = F.q.trim().toLowerCase();
    rows = rows.filter(x => (x.title??"").toLowerCase().includes(k) || (x.body??"").toLowerCase().includes(k));
  }
  rows.sort((a,b) => {
    const av = a.published_on ?? "", bv = b.published_on ?? "";
    return F.sort === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
  });

  const on = rows.filter(x=>x.is_on).length;
  const bud = rows.filter(x=>x.is_on).reduce((a,x)=>a+(x.daily_budget??0),0);
  setSub(`${num(rows.length)}건 · 운영 중 ${num(on)}건 · 일 예산 합계 ${won(bud)}`);
  setBody(rows.length
    ? (F.view === "폴더" ? folderView(rows) : listView(rows))
    : `<div class="card empty">해당 조건의 소재가 없습니다. 오른쪽 위 소재 추가로 등록하세요.</div>`);
  bindAdRows();
}

  return (f.type ?? "").startsWith("video")
    ? `<video src="${esc(u)}" style="width:100%;height:${h}px;object-fit:cover;border-radius:6px;background:#000" muted playsinline></video>`
    : `<img src="${esc(u)}" alt="${esc(f.name??"")}" loading="lazy" style="width:100%;height:${h}px;object-fit:cover;border-radius:6px;background:#F2F2EE">`;

function bindAdRows() {
  const B = $("a_body"); if (!B) return;

  B.querySelectorAll("input[data-on]").forEach(cb => cb.onchange = async () => {
    const card = B.querySelector(`[data-card="${cb.dataset.on}"]`);
    card.classList.toggle("off", !cb.checked);
    cb.parentElement.querySelector(".sm").textContent = cb.checked ? "ON" : "OFF";
    cb.parentElement.querySelector(".sm").style.color = cb.checked ? "var(--gA)" : "var(--muted)";
    await sb.from("ad_creatives").update({ is_on: cb.checked }).eq("id", cb.dataset.on);
  });

  B.querySelectorAll(".stars").forEach(box => box.onclick = async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const v = +b.dataset.v, id = box.dataset.starFor;
    box.querySelectorAll(".star").forEach(s => s.classList.toggle("on", +s.dataset.v <= v));
    await sb.from("ad_creatives").update({ rating: v }).eq("id", id);
  });

  B.querySelectorAll("[data-drop]").forEach(dz => {
    const id = dz.dataset.drop;
    const input = dz.querySelector(`input[data-file="${id}"]`);

    dz.tabIndex = 0;
    dz.onclick = (e) => {
      if (e.target.closest(".fbtns")) return;
      S.pasteTarget = id;
      B.querySelectorAll("[data-drop]").forEach(o => o.classList.toggle("focus", o === dz));
      dz.focus();
    };
    dz.ondblclick = (e) => { if (!e.target.closest(".fbtns")) input.click(); };
    dz.onfocus = () => { S.pasteTarget = id; dz.classList.add("focus"); };
    dz.onblur  = () => setTimeout(() => dz.classList.remove("focus"), 150);

    input.onchange = () => { uploadFiles(id, Array.from(input.files)); input.value = ""; };
    dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("over"); };
    dz.ondragleave = () => dz.classList.remove("over");
    dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove("over");
      uploadFiles(id, Array.from(e.dataTransfer.files)); };

    dz.onpaste = (e) => {
      const items = Array.from(e.clipboardData?.items ?? []);
      const files = items.filter(i => i.kind === "file").map(i => i.getAsFile()).filter(Boolean);
      if (files.length) { e.preventDefault(); uploadFiles(id, files); }
    };
  });

async function uploadFiles(id, files) {
  const ok = files.filter(f => f.type.startsWith("image/") || f.type.startsWith("video/"));
  if (!ok.length) { toast("이미지나 영상 파일만 넣을 수 있습니다."); return; }

  const dz = $("a_body")?.querySelector(`[data-drop="${id}"]`);
  if (dz) dz.classList.add("busy");
  toast(`${ok.length}개 올리는 중…`, true);

  const { data: cur, error: e0 } = await sb.from("ad_creatives").select("files").eq("id", id).single();
  if (e0) { toast("불러오지 못했습니다: " + e0.message); if (dz) dz.classList.remove("busy"); return; }
  const list = (cur?.files ?? []).slice();

  let done = 0, fail = 0;
  for (const f of ok) {
    if (f.size > 50*1024*1024) { toast(`${f.name||"파일"} 은 50MB를 넘어 올릴 수 없습니다.`); fail++; continue; }
    const mime = f.type || "application/octet-stream";
    let ext = (f.name?.split(".").pop() || "").toLowerCase();
    if (!ext || ext.length > 5) ext = (mime.split("/")[1] || "bin").split(";")[0];
    const nice = f.name && f.name !== "image.png"
      ? f.name
      : `${mime.startsWith("video")?"영상":"이미지"}-${new Date().toISOString().slice(0,19).replace(/[:T]/g,"")}.${ext}`;

    if (DEMO) {
      list.push({ path: URL.createObjectURL(f), name: nice, type: mime, size: f.size });
      done++; continue;
    }
    const path = `${S.ads.channel_id}/${id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, f, { contentType: mime, upsert: false });
    if (error) { toast(`${nice} 올리지 못했습니다: ${error.message}`); fail++; continue; }
    list.push({ path, name: nice, type: mime, size: f.size });
    done++;
  }

  if (done) {
    const { error } = await sb.from("ad_creatives").update({ files: list }).eq("id", id);
    if (error) { toast("저장하지 못했습니다: " + error.message); if (dz) dz.classList.remove("busy"); return; }
    toast(`${done}개 저장했습니다.${fail?` (${fail}개 실패)`:""}`);
    await loadAds();
    const back = $("a_body")?.querySelector(`[data-drop="${id}"]`);
    if (back) { back.classList.add("focus"); S.pasteTarget = id; }
  } else {
    if (dz) dz.classList.remove("busy");
  }
}

let _toastT = null;
function toast(msg, hold) {
  let el = $("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#16181D;"
      + "color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.2);"
      + "max-width:80vw;text-align:center";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(_toastT);
  if (!hold) _toastT = setTimeout(() => { el.style.display = "none"; }, 2600);
}

/* ============================================================
   메타 리포트
   ============================================================ */
const META_COLS = {
  date:   ["보고 시작","보고시작","시작","reporting starts","day","date","날짜","일"],
  end:    ["보고 종료","보고종료","reporting ends"],
  ad:     ["광고 이름","광고이름","ad name"],
  adset:  ["광고 세트 이름","광고세트 이름","ad set name"],
  plat:   ["플랫폼","platform"],
  place:  ["노출 위치","노출위치","placement"],
  device: ["기기 플랫폼","기기","device platform","impression device"],
  spend:  ["지출 금액","지출금액","amount spent","소진 금액"],
  imp:    ["노출","impressions"],
  reach:  ["도달","reach"],
  result: ["결과","results"],
  lead:   ["잠재 고객(양식)","잠재 고객","잠재고객","리드","leads","on-facebook leads"],
  deliv:  ["광고 게재","게재","delivery"],
  budget: ["광고 세트 예산","광고세트 예산","ad set budget"],
  btype:  ["광고 세트 예산 유형","budget type"]
};

function findCol(headers, keys) {
  const norm = headers.map(h => String(h ?? "").toLowerCase().replace(/\s|\(|\)|krw|₩/g,""));
  for (const k of keys) {
    const kk = k.toLowerCase().replace(/\s/g,"");
    const i = norm.findIndex(h => h === kk);
    if (i >= 0) return i;
  }
  for (const k of keys) {
    const kk = k.toLowerCase().replace(/\s/g,"");
    const i = norm.findIndex(h => h.startsWith(kk));
    if (i >= 0) return i;
  }
  return -1;
}

function isMetaHeaders(H) {
  return findCol(H, META_COLS.date) >= 0 && findCol(H, META_COLS.ad) >= 0 && findCol(H, META_COLS.spend) >= 0;
}

function parseMetaAoa(aoa) {
  let hi = -1;
  for (let i = 0; i < Math.min(aoa.length, 8); i++) {
    const H = aoa[i].map(x => String(x).trim());
    if (H.filter(x => x).length >= 4 && isMetaHeaders(H)) { hi = i; break; }
  }
  if (hi < 0) return null;
  const H = aoa[hi].map(x => String(x).trim());
  const C = {}; Object.entries(META_COLS).forEach(([k,keys]) => { C[k] = findCol(H, keys); });
  const mediaByCode = new Map(S.media.map(x => [x.code, x]));
  const rows = []; let bad = 0;
  aoa.slice(hi+1).forEach(r => {
    if (!r.some(x => String(x).trim() !== "")) return;
    const d = toDate(r[C.date]);
    const ad = String(r[C.ad] ?? "").trim();
    if (!d || !ad) { bad++; return; }
    const plat = C.plat >= 0 ? String(r[C.plat] ?? "").trim() : "";
    const place = C.place >= 0 ? String(r[C.place] ?? "").trim() : "";
    const md = (plat || place) ? mediaByCode.get(placeToMedia(plat, place)) : null;
    rows.push({
      stat_date: d, ad_name: ad,
      adset_name: C.adset >= 0 ? String(r[C.adset] ?? "").trim() || null : null,
      platform: plat || null, placement: place || null,
      device: C.device >= 0 ? String(r[C.device] ?? "").trim() || null : null,
      channel_id: md?.channel_id ?? null, media_id: md?.id ?? null,
      spend: toNum(r[C.spend]), impressions: toNum(r[C.imp]),
      reach: C.reach >= 0 ? toNum(r[C.reach]) : 0,
      results: C.lead >= 0 && String(r[C.lead]).trim() !== "" ? toNum(r[C.lead])
             : C.result >= 0 ? toNum(r[C.result]) : 0,
      adset_budget: C.budget >= 0 ? (toNum(r[C.budget]) || null) : null,
      budget_type: C.btype >= 0 ? String(r[C.btype] ?? "").trim() || null : null,
      delivery: C.deliv >= 0 ? String(r[C.deliv] ?? "").trim() || null : null
    });
  });
  if (!rows.length) return null;
  const dates = rows.map(r=>r.stat_date).sort();
  return { rows, bad, from: dates[0], to: dates[dates.length-1],
    ads: Array.from(new Set(rows.map(r=>r.ad_name))),
    spend: rows.reduce((a,r)=>a+r.spend,0),
    imp: rows.reduce((a,r)=>a+r.impressions,0),
    results: rows.reduce((a,r)=>a+r.results,0) };
}

/* 플랫폼 + 노출위치 → 매체코드 */
function placeToMedia(plat, place) {
  const p = String(plat ?? "");
  const q = String(place ?? "");
  const isIG = /instagram|인스타/i.test(p);
  if (/스토리|story/i.test(q))                  return isIG ? "IG-STORY" : "MT-STORY";
  if (/릴스|reel/i.test(q))                     return isIG ? "IG-REEL"  : "MT-REEL";
  if (/피드|feed|탐색|explore|프로필|profile/i.test(q)) return isIG ? "IG-FEED"  : "MT-FEED";
  if (isIG) return "IG-FEED";
  if (/검색|search|marketplace|마켓|메신저|messenger|인스트림|instream|비디오|video/i.test(q)) return "MT-AN";
  return "MT-AN";
}

const toNum = (v) => {
  if (v == null || v === "") return 0;
  const n = Number(String(v).replace(/[^0-9.\-]/g, ""));
  return isNaN(n) ? 0 : n;
};
function toDate(v) {
  if (v instanceof Date && !isNaN(v)) return ymd(v);
  const s = String(v ?? "").trim();
  const m = s.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  const d = new Date(s);
  return isNaN(d) ? null : ymd(d);
}

function takeMeta(files) {
  const ok = files.filter(f => /\.(xlsx|xls|csv)$/i.test(f.name));
  const m = $("mt_msg");
  if (!ok.length) { m.className="msg err"; m.textContent="엑셀이나 CSV 파일만 올릴 수 있습니다."; return; }
  m.textContent = "";
  if (ok.length === 1) { S.meta.queue = null; renderMetaQueue(null); readMeta(ok[0]); return; }
  runMetaQueue(ok);
}

function renderMetaQueue(Q) {
  const box = $("mt_queue"); if (!box) return;
  if (!Q) { box.innerHTML = ""; return; }
  const done = Q.items.filter(x => x.state !== "wait" && x.state !== "run").length;
  const spend = Q.items.reduce((a,x)=>a+(x.spend||0),0);
  const rows  = Q.items.reduce((a,x)=>a+(x.rows||0),0);
  const res   = Q.items.reduce((a,x)=>a+(x.res||0),0);
  box.innerHTML = `<section class="card" style="margin-bottom:12px">
    <div class="p16" style="padding-bottom:10px;display:flex;justify-content:space-between;align-items:baseline">
      <h2 class="h2">일괄 처리 ${Q.running?"진행 중":"완료"}</h2>
      <span class="sm muted">${done} / ${Q.items.length} 파일</span></div>
    <div style="padding:0 16px 12px"><div class="pbar"><div style="width:${(done/Q.items.length*100).toFixed(0)}%"></div></div></div>
    <div style="border-top:1px solid var(--line)">
      ${Q.items.map(x=>`<div class="qrow">
        <span class="qdot ${x.state==="run"?"run":x.state==="ok"?"ok":x.state==="err"?"err":x.state==="skip"?"skip":""}"></span>
        <span class="qname">${esc(x.name)}</span>
        <span class="qstat">${esc(x.msg ?? "대기 중")}</span></div>`).join("")}
    </div>
    ${!Q.running?`<div class="p16" style="border-top:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap;align-items:center">
      <span class="sm"><b>${num(rows)}</b>행 저장</span>
      <span class="sm">지출 <b>${won(spend)}</b></span>
      <span class="sm">결과 <b>${num(res)}</b>건</span>
      <button class="btn" id="mq_go" style="height:28px;margin-left:auto">성과 보기</button>
      <button class="btn" id="mq_close" style="height:28px">닫기</button></div>`:""}
  </section>`;
  if ($("mq_close")) $("mq_close").onclick = () => { S.meta.queue = null; renderMetaQueue(null); };
  if ($("mq_go")) $("mq_go").onclick = () => { S.meta.queue = null; S.costTab = "소재별 성과"; vCosts(); };
}

async function runMetaQueue(files) {
  const Q = { running:true, items: files.map(f => ({ name:f.name, state:"wait", msg:null, rows:0, spend:0, res:0 })) };
  S.meta.queue = Q;
  $("mt_prev").innerHTML = "";
  renderMetaQueue(Q);
  const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
  for (let i = 0; i < files.length; i++) {
    const it = Q.items[i];
    it.state = "run"; it.msg = "읽는 중"; renderMetaQueue(Q);
    try {
      const wb = XLSX.read(await files[i].arrayBuffer(), { type:"array", cellDates:true });
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, blankrows:false, defval:"" });
      const P = parseMetaAoa(aoa);
      if (!P) { it.state="skip"; it.msg="메타 리포트 형식 아님"; renderMetaQueue(Q); continue; }
      it.spend = P.spend; it.res = P.results;
      it.msg = `${P.from}~${P.to} · ${num(P.rows.length)}행 저장 중`; renderMetaQueue(Q);
      const saved = await pushMeta(P.rows, files[i].name, true);
      it.rows = saved.ok;
      if (!saved.ok) { it.state="err"; it.msg = saved.err || "저장 실패"; }
      else { it.state="ok"; it.msg = `${P.from}~${P.to} · ${num(saved.ok)}행 · ${won(P.spend)} · 결과 ${num(P.results)}건`; }
    } catch (e) { it.state="err"; it.msg = e.message; }
    renderMetaQueue(Q);
  }
  Q.running = false;
  renderMetaQueue(Q);
}

async function pushMeta(rows, fileName, sync) {
  const { data: batch } = await sb.from("import_batches").insert({
    type:"ad_cost", file_name:fileName, row_count:rows.length, uploaded_by:S.user?.id ?? null
  }).select("id").single();

  const merged = new Map();
  rows.forEach(r => {
    const k = [r.stat_date, r.ad_name, r.adset_name, r.platform, r.placement, r.device].join("\u0001");
    const x = merged.get(k);
    if (x) { x.spend += r.spend; x.impressions += r.impressions; x.reach += r.reach; x.results += r.results; }
    else merged.set(k, { ...r });
  });
  const payload = Array.from(merged.values()).map(r => ({ ...r, import_batch_id: batch?.id ?? null }));

  // 형식이 달라도 이중 집계가 없도록:
  // 이 파일이 담고 있는 기간 × 소재의 기존 데이터를 먼저 지우고 새 값으로 대체
  {
    const dts = rows.map(r => r.stat_date).sort();
    const dFrom = dts[0], dTo = dts[dts.length - 1];
    const names = Array.from(new Set(rows.map(r => r.ad_name)));
    for (let i = 0; i < names.length; i += 100) {
      await sb.from("meta_ad_daily").delete()
        .gte("stat_date", dFrom).lte("stat_date", dTo)
        .in("ad_name", names.slice(i, i + 100));
    }
  }

  let ok = 0, err = "";
  for (let i = 0; i < payload.length; i += 300) {
    const n = Math.min(300, payload.length - i);
    const { error } = await sb.from("meta_ad_daily").upsert(payload.slice(i, i+n), {
      onConflict: "stat_date,ad_name,adset_name,platform,placement,device" });
    if (error) err = error.message; else ok += n;
  }

  if (sync && ok) {
    const agg = new Map();
    rows.forEach(r => {
      if (!r.media_id) return;
      const k = `${r.stat_date}|${r.media_id}`;
      const x = agg.get(k) ?? { cost_date:r.stat_date, channel_id:r.channel_id, media_id:r.media_id,
        campaign_id:null, creative_id:null, cost:0, impressions:0, clicks:0 };
      x.cost += r.spend; x.impressions += r.impressions;
      agg.set(k, x);
    });
    const list = Array.from(agg.values()).map(x => ({ ...x, cost: Math.round(x.cost) }));
    for (let i = 0; i < list.length; i += 200) {
      await sb.from("ad_costs").upsert(list.slice(i, i+200), {
        onConflict: "cost_date,channel_id,media_id,campaign_id,creative_id" });
    }
  }
  return { ok, err };
}

async function readMeta(file) {
  if (!file) return;
  const m = $("mt_msg");
  m.className = "msg"; m.textContent = "파일을 읽는 중";
  try {
    const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
    const wb = XLSX.read(await file.arrayBuffer(), { type:"array", cellDates:true });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, blankrows:false, defval:"" });
    const P = parseMetaAoa(aoa);
    if (!P) { m.className="msg err"; m.textContent="메타 리포트 형식이 아닙니다. 보고 시작 · 광고 이름 · 지출 금액 열이 필요합니다."; return; }
    S.meta.parsed = { ...P, file: file.name };
    m.textContent = "";
    renderMetaPreview();
  } catch (err) { m.className="msg err"; m.textContent = "파일을 읽지 못했습니다: " + err.message; }
}

async function saveMeta() {
  const P = S.meta.parsed, m = $("mt_smsg");
  const sync = $("mt_sync").checked;
  $("mt_save").disabled = true;
  m.className = "msg"; m.textContent = "저장 중";

  const r = await pushMeta(P.rows, P.file, sync);
  if (!r.ok) {
    $("mt_save").disabled = false;
    m.className="msg err"; m.textContent = "저장하지 못했습니다: " + (r.err || "알 수 없는 오류");
    return;
  }
  m.className="msg"; m.textContent = `${num(r.ok)}건을 저장했습니다.${r.err?" 일부 실패":""}`;
  S.meta.parsed = null;
  setTimeout(() => { S.costTab = "소재별 성과"; vCosts(); }, 900);
}

const MP_COLS = [
  ["ad","광고 소재"],["card","연결 카드"],["days","일수"],["budget","일일예산"],["spend","지출"],
  ["burn","소진율"],["imp","노출"],["res","결과"],["cpl","건당 비용"],["cpm","CPM"],["share","비중"]
];

async function metaPerfView() {
  const M = S.meta;
  if (!M.sort) M.sort = { col:"spend", dir:"desc" };
  const [dl, cr, ac] = await Promise.all([
    fetchAllRows(() => sb.from("v_meta_daily").select("*").gte("d", M.from).lte("d", M.to).order("d")),
    sb.from("v_meta_creative").select("*"),
    sb.from("ad_creatives").select("id,title,meta_ad_name,rating,is_on")
  ]);
  const rawDaily = dl.error ? [] : (dl.data ?? []);
  const daily = rawDaily.filter(r =>
    Number(r.spend) > 0 || Number(r.impressions) > 0 || Number(r.results) > 0);
  const cards = ac.error ? [] : (ac.data ?? []);

  if (!daily.length) {
    $("c_body").innerHTML = `<div class="card empty">해당 기간의 메타 실적이 없습니다. 리포트 업로드 탭에서 파일을 올리거나 기간을 넓혀보세요.</div>`;
    renderMpFilter();
    return;
  }

  const inRange = new Map();
  daily.forEach(r => {
    const x = inRange.get(r.ad_name) ?? { ad:r.ad_name, spend:0, imp:0, res:0, budget:null, days:new Set() };
    x.spend += Number(r.spend); x.imp += Number(r.impressions); x.res += Number(r.results); x.days.add(r.d);
    if (r.adset_budget) x.budget = Math.max(x.budget ?? 0, Number(r.adset_budget));
    inRange.set(r.ad_name, x);
  });
  const T = Array.from(inRange.values()).reduce((a,x)=>({spend:a.spend+x.spend, imp:a.imp+x.imp, res:a.res+x.res}),{spend:0,imp:0,res:0});
  const avgCpl = T.res ? T.spend / T.res : null;

  let list = Array.from(inRange.values()).map(x => ({ ...x,
    daysN: x.days.size,
    burn: x.budget && x.days.size ? x.spend/(x.budget*x.days.size)*100 : null,
    cpl: x.res ? x.spend/x.res : null,
    cpm: x.imp ? x.spend/x.imp*1000 : null,
    share: T.spend ? x.spend/T.spend*100 : null,
    dev: null }));
  list.forEach(x => { if (x.cpl != null && avgCpl) x.dev = (x.cpl - avgCpl)/avgCpl*100; });

  const key = { ad:"ad", days:"daysN", budget:"budget", spend:"spend", burn:"burn",
    imp:"imp", res:"res", cpl:"cpl", cpm:"cpm", share:"share" }[M.sort.col] ?? "spend";
  list.sort((a,b) => {
    const av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    const r = typeof av === "string" ? av.localeCompare(bv) : av - bv;
    return M.sort.dir === "asc" ? r : -r;
  });

  const tm = new Map();
  daily.forEach(r => {
    const x = tm.get(r.d) ?? { d:r.d, k:r.d.slice(5), spend:0, res:0 };
    x.spend += Number(r.spend); x.res += Number(r.results); tm.set(r.d, x);
  });
  const trend = Array.from(tm.values()).sort((a,b)=>a.d.localeCompare(b.d));

  const cardBy = new Map(cards.filter(c=>c.meta_ad_name).map(c=>[c.meta_ad_name, c]));

  const byDate = new Map();
  daily.forEach(r => { const a = byDate.get(r.d) ?? []; a.push(r); byDate.set(r.d, a); });
  const dateKeys = Array.from(byDate.keys()).sort((a,b)=>b.localeCompare(a));

  const arrow = (c) => M.sort.col === c ? (M.sort.dir === "asc" ? " ▲" : " ▼") : "";

  $("c_body").innerHTML = `
    <div id="mp_filter"></div>

    <div class="grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:12px">
      ${[["지출",won(T.spend)],["노출",num(T.imp)],["결과(유입)",num(T.res)+"건"],
         ["건당 비용",avgCpl?won(avgCpl):"-"],["CPM",T.imp?won(T.spend/T.imp*1000):"-"]]
        .map(([l,v])=>`<div class="card p16"><div class="lbl">${l}</div><div class="val">${v}</div></div>`).join("")}
    </div>

    <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:12px">
      <section class="card p16"><h2 class="h2" style="margin-bottom:12px">일별 지출</h2>${svgLine(trend,"spend")}</section>
      <section class="card p16"><h2 class="h2" style="margin-bottom:12px">일별 유입(결과)</h2>${svgLine(trend,"res","#0E7A5F")}</section>
    </div>

    <div class="card scroll" style="margin-bottom:12px">
      <div class="p16" style="padding-bottom:8px;display:flex;justify-content:space-between;align-items:baseline">
        <h2 class="h2">소재별 성과 <span class="sm muted">${num(list.length)}개</span></h2>
        <button class="btn" id="mp_sortrs" style="height:26px;font-size:11px">정렬 초기화</button></div>
      <table><thead><tr>
        ${MP_COLS.map(([c,l])=>c==="card"
          ? `<th>${l}</th>`
          : `<th class="sortable" data-sc="${c}">${l}${arrow(c)}</th>`).join("")}
      </tr></thead>
      <tbody>${list.map(x=>{
        const c = cardBy.get(x.ad);
        const devTxt = x.dev == null ? "" :
          ` <span class="sm" style="color:${x.dev>0?"var(--gD)":"var(--gA)"}">(${x.dev>0?"+":""}${x.dev.toFixed(0)}%)</span>`;
        return `<tr>
          <td style="font-weight:500;max-width:260px;overflow:hidden;text-overflow:ellipsis">${esc(x.ad)}</td>
          <td class="sm">${c?`${esc(c.title??"")} ${"★".repeat(c.rating)}`:`<button class="btn" data-link="${esc(x.ad)}" style="height:24px;padding:0 7px;font-size:11px">연결</button>`}</td>
          <td class="muted">${x.daysN}일</td>
          <td class="muted">${x.budget?won(x.budget):"-"}</td>
          <td style="font-weight:500">${won(x.spend)}</td>
          <td class="muted">${x.burn!=null?pct(x.burn,0):"-"}</td>
          <td class="muted">${num(x.imp)}</td>
          <td>${num(x.res)}</td>
          <td style="font-weight:500;${x.dev!=null&&x.dev>30?"color:var(--gD)":x.cpl!=null&&x.dev!=null&&x.dev<=0?"color:var(--gA)":""}">${x.cpl?won(x.cpl):"-"}${devTxt}</td>
          <td class="muted">${x.cpm?won(x.cpm):"-"}</td>

function bucketKey(d, unit) {
  if (unit === "일") return d;
  if (unit === "주") return weekStart(d);
  return d.slice(0,7);
}

async function pCompare() {
  $("psub").textContent = "직전 동일 기간과 나란히 비교합니다";
  $("pctl").innerHTML = `<div class="seg" id="cu">${["일","주","월"].map(u=>`<button data-u="${u}"${S.cmpUnit===u?' class="on"':""}>${u}별</button>`).join("")}</div>`;
  $("cu").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; S.cmpUnit = b.dataset.u; pCompare(); };

  const span = S.cmpUnit === "일" ? 14 : S.cmpUnit === "주" ? 56 : 180;
  const from = daysAgo(span*2), mid = daysAgo(span);
  const { data } = await sb.from("v_perf_daily").select("*").gte("d", from).order("d");
  const all = data ?? [];

  const agg = (rows) => {
    const m = new Map();
    rows.forEach(r => {
      const k = bucketKey(r.d, S.cmpUnit);
      const c = m.get(k) ?? { k, leads:0, cost:0, ct:0, rev:0, total:0 };
      c.leads += r.valid_leads; c.total += r.total_leads;
      c.cost += Number(r.cost); c.ct += r.contracts; c.rev += Number(r.revenue);
      m.set(k, c);
    });
    return Array.from(m.values()).sort((a,b)=>a.k.localeCompare(b.k))
      .map(x => ({ ...x, cpa: x.leads&&x.cost?x.cost/x.leads:null, cps: x.ct&&x.cost?x.cost/x.ct:null,
        roas: x.cost?x.rev/x.cost:null, arpu: x.ct?x.rev/x.ct:null }));
  };
  const curRows = all.filter(r => r.d >= mid), prevRows = all.filter(r => r.d < mid);
  const cur = agg(curRows), prev = agg(prevRows);
  const sum = (rows) => rows.reduce((a,r)=>({leads:a.leads+r.valid_leads,cost:a.cost+Number(r.cost),
    ct:a.ct+r.contracts,rev:a.rev+Number(r.revenue)}),{leads:0,cost:0,ct:0,rev:0});
  const A = sum(curRows), B = sum(prevRows);
  const mk = (o) => ({ ...o, cpa:o.leads&&o.cost?o.cost/o.leads:null, cps:o.ct&&o.cost?o.cost/o.ct:null,
    roas:o.cost?o.rev/o.cost:null, arpu:o.ct?o.rev/o.ct:null });

async function pMomentum() {
  $("psub").textContent = "채널별 투자 대비 성과 흐름";
  $("pctl").innerHTML = `<div class="seg" id="cu">${["일","주","월"].map(u=>`<button data-u="${u}"${S.cmpUnit===u?' class="on"':""}>${u}별</button>`).join("")}</div>`;
  $("cu").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; S.cmpUnit = b.dataset.u; pMomentum(); };

  const span = S.cmpUnit === "일" ? 14 : S.cmpUnit === "주" ? 56 : 180;
  const mid = daysAgo(span);
  const { data } = await sb.from("v_perf_daily").select("*").gte("d", daysAgo(span*2)).order("d");
  const all = data ?? [];

  const byCh = (rows) => {
    const m = new Map();
    rows.forEach(r => {
      const c = m.get(r.channel_id) ?? { id:r.channel_id, name:r.channel_name, leads:0, cost:0, ct:0, rev:0 };
      c.leads += r.valid_leads; c.cost += Number(r.cost); c.ct += r.contracts; c.rev += Number(r.revenue);
      m.set(r.channel_id, c);
    });
    return m;
  };
  const A = byCh(all.filter(r=>r.d>=mid)), B = byCh(all.filter(r=>r.d<mid));
  const calc = (o) => o ? { ...o, cpa:o.leads&&o.cost?o.cost/o.leads:null, cps:o.ct&&o.cost?o.cost/o.ct:null,
    roas:o.cost?o.rev/o.cost:null, arpu:o.ct?o.rev/o.ct:null } : null;
  const list = Array.from(A.values()).map(x=>({ cur:calc(x), prev:calc(B.get(x.id)) }))
    .sort((a,b)=>b.cur.leads-a.cur.leads);

  const series = new Map();
  all.filter(r=>r.d>=mid).forEach(r => {
    const k = bucketKey(r.d, S.cmpUnit);
    if (!series.has(r.channel_id)) series.set(r.channel_id, new Map());
    const s = series.get(r.channel_id);
    const c = s.get(k) ?? { k, leads:0, cost:0 };
    c.leads += r.valid_leads; c.cost += Number(r.cost); s.set(k,c);
  });

  $("pbody").innerHTML = list.length ? `
    <div class="card scroll" style="margin-bottom:12px">
      <table><thead><tr><th>채널</th><th>유효 DB</th><th></th><th>광고비</th><th></th>
        <th>CPA</th><th></th><th>계약</th><th>CPS</th><th>객단가</th><th>ROAS</th><th></th></tr></thead>
      <tbody>${list.map(({cur,prev})=>`<tr>
        <td style="font-weight:500">${esc(cur.name)}</td>
        <td>${num(cur.leads)}</td><td class="sm">${delta(cur.leads,prev?.leads,false)}</td>
        <td>${cur.cost?won(cur.cost):"-"}</td><td class="sm">${delta(cur.cost,prev?.cost,true)}</td>
        <td>${cur.cpa?won(cur.cpa):"-"}</td><td class="sm">${delta(cur.cpa,prev?.cpa,true)}</td>
        <td>${num(cur.ct)}</td><td>${cur.cps?won(cur.cps):"-"}</td>
        <td>${cur.arpu?won(cur.arpu):"-"}</td>
        <td>${cur.roas!=null?cur.roas.toFixed(2)+"배":"-"}</td>
        <td class="sm">${delta(cur.roas,prev?.roas,false)}</td></tr>`).join("")}
      </tbody></table></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
      ${list.map(({cur})=>{
        const s = Array.from((series.get(cur.id) ?? new Map()).values()).sort((a,b)=>a.k.localeCompare(b.k));
        return `<section class="card p16"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
          <h3 class="h2">${esc(cur.name)}</h3><span class="sm muted">유효 DB ${num(cur.leads)}</span></div>
          ${svgLine(s,"leads")}</section>`;
      }).join("")}</div>`
    : `<div class="card empty">비교할 데이터가 없습니다.</div>`;
}

function vData() {
  $("main").innerHTML = `<div class="head"><div><h1 class="h1">자료관리</h1>
    <p class="sm muted" style="margin-top:4px">선택한 기간의 자료를 CSV로 내려받습니다</p></div></div>
    <section class="card p16" style="max-width:620px">
      <label class="f" style="margin-bottom:12px"><span class="lbl">자료 종류</span>
        <select class="inp" id="d_src">${SRC.map(s=>`<option value="${s.k}">${s.l}</option>`).join("")}</select></label>
      <div class="grid" style="grid-template-columns:1fr 1fr 1fr">
        <label class="f"><span class="lbl">시작일</span><input class="inp" type="date" id="d_from" value="${daysAgo(30)}"></label>
        <label class="f"><span class="lbl">종료일</span><input class="inp" type="date" id="d_to" value="${ymd(new Date())}"></label>
        <div style="display:flex;align-items:flex-end"><button class="btn-solid" id="d_go" style="width:100%">CSV 내려받기</button></div>
      </div><p class="msg" id="d_msg"></p></section>
    <section class="card p16" style="max-width:620px;margin-top:12px">
      <h2 class="h2" style="margin-bottom:8px">개인정보 취급 안내</h2>
      <ul class="muted" style="font-size:12px;line-height:1.8;padding-left:16px">
        <li>DB 원장 내보내기에는 고객명과 연락처가 포함됩니다.</li>
        <li>내려받기 기록은 접근 이력에 남습니다.</li>
        <li>내려받은 파일은 공유 폴더나 메신저에 올리지 마세요.</li></ul></section>`;

  $("d_go").onclick = async () => {
    const meta = SRC.find(s=>s.k===$("d_src").value), m = $("d_msg");
    m.className="msg"; m.textContent="준비 중";
    const build = () => {
      let q = sb.from(meta.k).select("*");
      if (meta.d) q = q.gte(meta.d,$("d_from").value)
        .lte(meta.d, meta.d==="inflow_at" ? $("d_to").value+"T23:59:59" : $("d_to").value)
        .order(meta.d);
      return q;
    };
    const { data, error } = await fetchAllRows(build, 30);
    if (error) { m.className="msg err"; m.textContent="불러오지 못했습니다: "+error.message; return; }
    const rows = data ?? [];
    if (!rows.length) { m.className="msg err"; m.textContent="해당 기간에 데이터가 없습니다."; return; }
    const blob = new Blob(["\uFEFF"+toCsv(rows)],{type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = `${meta.l}_${$("d_from").value}_${$("d_to").value}.csv`; a.click();
    URL.revokeObjectURL(url);
    await sb.from("audit_logs").insert({ user_id:S.user?.id??null, action:"export",
      table_name:meta.k, record_id:`${$("d_from").value}~${$("d_to").value}` });
    m.className="msg"; m.textContent = `${num(rows.length)}행 내려받았습니다.`;
  };
}
