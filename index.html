          <td class="muted">${esc(S.camps.find(x=>x.id===c.campaign_id)?.name??"-")}</td>
          <td class="mono muted">${esc(c.code)}</td>
          <td><button class="btn" data-rdel="${c.id}" style="height:26px;padding:0 8px;color:var(--gD)">삭제</button></td></tr>`).join("")}
        </tbody></table></div>`:`<div class="card empty">등록된 소재가 없습니다.</div>`}`;
  } else if (S.setTab === "UTM 링크") {
    body = `<section class="card p16" style="max-width:720px">
      <h2 class="h2" style="margin-bottom:12px">UTM 링크 만들기</h2>
      <label class="f" style="margin-bottom:12px"><span class="lbl">랜딩 주소</span>
        <input class="inp" id="u_base" placeholder="https://example.com/quote"></label>
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">
        <label class="f"><span class="lbl">매체</span><select class="inp" id="u_md2"><option value="">선택</option>
          ${S.media.filter(m=>m.is_active).map(m=>`<option value="${m.id}">${esc(chName(m.channel_id)+" · "+m.name)}</option>`).join("")}</select></label>
        <label class="f"><span class="lbl">캠페인</span><select class="inp" id="u_cp"><option value="">선택 안 함</option>
          ${S.camps.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label>
        <label class="f"><span class="lbl">소재</span><select class="inp" id="u_cr"><option value="">선택 안 함</option>
          ${S.creas.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join("")}</select></label>
      </div>
      <div style="margin-top:16px"><span class="lbl">완성된 링크</span>
        <div id="u_out" style="border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--paper);
          font-size:12px;word-break:break-all;min-height:48px;margin-top:4px">랜딩 주소와 매체를 선택하면 링크가 만들어집니다.</div>
        <button class="btn" id="u_cpy" style="margin-top:8px">링크 복사</button>
        <span class="msg" id="u_msg"></span></div></section>`;
  } else {
    body = `<section class="card p16" style="max-width:420px">
      <h2 class="h2" style="margin-bottom:4px">비밀번호 변경</h2>
      <p class="sm muted" style="margin-bottom:16px">현재 계정: ${esc(S.user?.email??"")} · 권한 ${S.role==="owner"?"대표":"마케터"}</p>
      <label class="f" style="margin-bottom:10px"><span class="lbl">새 비밀번호</span>
        <input class="inp" id="p_new" type="password" placeholder="6자 이상"></label>
      <label class="f" style="margin-bottom:16px"><span class="lbl">새 비밀번호 확인</span>
        <input class="inp" id="p_re" type="password"></label>
      <button class="btn-solid" id="p_go">변경</button><span class="msg" id="p_msg"></span>
      <p class="sm muted" style="margin-top:16px;line-height:1.7">변경 즉시 적용됩니다. 로그인 중인 계정의 비밀번호만 바뀝니다.</p></section>`;
  }

  $("main").innerHTML = `<div class="head"><div><h1 class="h1">설정</h1></div></div>
    <div class="seg" id="stab" style="margin-bottom:16px">${TABS.map(t=>`<button data-t="${t}"${S.setTab===t?' class="on"':""}>${t}</button>`).join("")}</div>
    ${body}`;
  $("stab").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; S.setTab = b.dataset.t; vSettings(); };

  if (S.setTab === "채널·매체") {
    $("main").querySelectorAll("input[data-mid]").forEach(cb => cb.onchange = async () => {
      await sb.from("media").update({ is_active: cb.checked }).eq("id", +cb.dataset.mid);
      await loadMasters();
    });
  }
  if (S.setTab === "캠페인") {
    const auto = () => {
      if ($("k_edit").checked) return;
      const md = S.media.find(x=>x.id===+$("k_md").value);
      if (!md) { $("k_cd").value=""; return; }
      const pre = `${md.code}-${yymm()}-`; let n = 1;
      while (S.camps.some(c=>c.code===pre+String(n).padStart(3,"0"))) n++;
      $("k_cd").value = pre+String(n).padStart(3,"0");
    };
    $("k_md").onchange = auto;
    $("k_edit").onchange = (e) => { const f=$("k_cd"); f.readOnly=!e.target.checked;
      f.style.background = e.target.checked?"#fff":"#F4F4F0"; f.style.color = e.target.checked?"inherit":"var(--muted)";
      if (!e.target.checked) auto(); else f.focus(); };
    $("k_go").onclick = async () => {
      const m = $("k_msg");
      if (!$("k_md").value) { m.className="msg err"; m.textContent="매체를 선택하세요."; return; }
      if (!$("k_nm").value.trim()) { m.className="msg err"; m.textContent="캠페인 이름을 입력하세요."; return; }
      $("k_go").disabled = true;
      const { error } = await sb.from("campaigns").insert({
        code:$("k_cd").value.toUpperCase(), media_id:+$("k_md").value, name:$("k_nm").value.trim() });
      $("k_go").disabled = false;
      if (error) { m.className="msg err"; m.textContent="저장하지 못했습니다: "+error.message; return; }
      vSettings();
    };
    $("main").querySelectorAll("button[data-kdel]").forEach(b => b.onclick = async () => {
      if (!confirm("이 캠페인을 삭제할까요?")) return;
      const { error } = await sb.from("campaigns").delete().eq("id", +b.dataset.kdel);
      if (error) { $("k_msg").className="msg err"; $("k_msg").textContent="연결된 자료가 있어 삭제할 수 없습니다."; return; }
      vSettings();
    });
  }
  if (S.setTab === "소재") {
    const auto = () => {
      if ($("r_edit").checked) return;
      const pre = `CR-${yymm()}-`; let n = 1;
      while (S.creas.some(c=>c.code===pre+String(n).padStart(3,"0"))) n++;
      $("r_cd").value = pre+String(n).padStart(3,"0");
    };
    auto();
    $("r_edit").onchange = (e) => { const f=$("r_cd"); f.readOnly=!e.target.checked;
      f.style.background = e.target.checked?"#fff":"#F4F4F0"; f.style.color = e.target.checked?"inherit":"var(--muted)";
      if (!e.target.checked) auto(); else f.focus(); };
    $("r_go").onclick = async () => {
      const m = $("r_msg");
      if (!$("r_ti").value.trim()) { m.className="msg err"; m.textContent="소재 제목을 입력하세요."; return; }
      $("r_go").disabled = true;
      const { error } = await sb.from("creatives").insert({
        code:$("r_cd").value.toUpperCase(), title:$("r_ti").value.trim(), type:$("r_ty").value,
        campaign_id:$("r_cp").value?+$("r_cp").value:null });
      $("r_go").disabled = false;
      if (error) { m.className="msg err"; m.textContent="저장하지 못했습니다: "+error.message; return; }
      vSettings();
    };
    $("main").querySelectorAll("button[data-rdel]").forEach(b => b.onclick = async () => {
      if (!confirm("이 소재를 삭제할까요?")) return;
      const { error } = await sb.from("creatives").delete().eq("id", +b.dataset.rdel);
      if (error) { $("r_msg").className="msg err"; $("r_msg").textContent="연결된 자료가 있어 삭제할 수 없습니다."; return; }
      vSettings();
    });
  }
  if (S.setTab === "UTM 링크") {
    const build = () => {
      const base = $("u_base").value.trim();
      const md = S.media.find(x=>x.id===+$("u_md2").value);
      if (!base || !md) return "";
      const ch = S.channels.find(c=>c.id===md.channel_id);
      const cp = S.camps.find(c=>c.id===+$("u_cp").value);
      const cr = S.creas.find(c=>c.id===+$("u_cr").value);
      const p = new URLSearchParams();
      p.set("utm_source",(ch?.code??"").toLowerCase());
      p.set("utm_medium",(md.code.split("-").slice(1).join("-")||md.code).toLowerCase());
      if (cp) p.set("utm_campaign", cp.code.toLowerCase());
      if (cr) p.set("utm_content", cr.code.toLowerCase());
      return base + (base.includes("?")?"&":"?") + p.toString();
    };
    const upd = () => { $("u_out").textContent = build() || "랜딩 주소와 매체를 선택하면 링크가 만들어집니다."; };
    ["u_base","u_md2","u_cp","u_cr"].forEach(id => { $(id).oninput = upd; $(id).onchange = upd; });
    $("u_cpy").onclick = () => { const u = build(); if (!u) return;
      navigator.clipboard.writeText(u); $("u_msg").textContent = "링크를 복사했습니다."; };
  }
  if (S.setTab === "계정") {
    $("p_go").onclick = async () => {
      const m = $("p_msg"), a = $("p_new").value, b = $("p_re").value;
      if (a.length < 6) { m.className="msg err"; m.textContent="6자 이상 입력하세요."; return; }
      if (a !== b) { m.className="msg err"; m.textContent="두 비밀번호가 다릅니다."; return; }
      $("p_go").disabled = true;
      const { error } = await sb.auth.updateUser({ password:a });
      $("p_go").disabled = false;
      if (error) { m.className="msg err"; m.textContent="변경하지 못했습니다: "+error.message; return; }
      $("p_new").value=""; $("p_re").value="";
      m.className="msg"; m.textContent="비밀번호를 변경했습니다.";
    };
  }
}

/* ---------- router ---------- */
async function route() {
  const fn = { dashboard:vDashboard, costs:vCosts, ads:vAds, contracts:vContracts,
    performance:vPerformance, pnl:vPnl, data:vData, settings:vSettings }[S.page];
  if (!fn) { S.page = "dashboard"; return route(); }
  try { await fn(); }
  catch (e) { $("main").innerHTML = `<div class="card empty">화면을 불러오지 못했습니다.<br><span class="sm">${esc(e.message)}</span></div>`; }
}

/* ---------- boot ---------- */
if (!SUPABASE_URL.startsWith("http") || SUPABASE_ANON.length < 30) {
  configView();
} else {
  const { data } = await sb.auth.getSession();
  S.user = data.session?.user ?? null;
  sb.auth.onAuthStateChange(async (_e, s) => {
    const was = !!S.user;
    S.user = s?.user ?? null;
    if (!S.user) { loginView(); return; }
    if (!was) { await loadMasters(); shell(); route(); }
  });
  if (S.user) { await loadMasters(); shell(); route(); } else loginView();
}
</script>
</body>
</html>
